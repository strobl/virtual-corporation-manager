name: Product acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  packed-product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.14.0', '24', '26.0.0', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:package
        env:
          GITFLASH_EVIDENCE_DIR: acceptance-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-${{ matrix.node }}
          path: acceptance-evidence/
  local-workflow-sandbox:
    strategy:
      fail-fast: false
      matrix:
        # Keep latest Linux as a compatibility probe; test an explicitly named
        # runner too, without changing any host namespace or AppArmor policy.
        os: [ubuntu-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the pinned optional CLI without an account
        run: npm install --prefix "$RUNNER_TEMP/gitflash-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.138.0
      - name: Verify local Python sandbox without a model request
        run: node node_modules/vitest/vitest.mjs run tests/workflow-sandbox-live.test.ts
        env:
          GITFLASH_CODEX_PATH: ${{ runner.temp }}/gitflash-codex/node_modules/.bin/codex
          GITFLASH_PYTHON_PATH: /usr/bin/python3
          GITFLASH_LIVE_SANDBOX: '1'
